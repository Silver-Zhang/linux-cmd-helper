name: Shell Checks

on:
  push:
  pull_request:

jobs:
  bash-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          find ./bin ./lib ./tests -type f -print0 | xargs -0 -n1 bash -n

      - name: Run integration tests
        run: bash tests/integration.sh

      - name: Install ShellCheck
        if: matrix.os == 'macos-latest'
        run: brew install shellcheck

      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh bin/* lib/* tests/*
