name: Shell Checks

on:
  push:
  pull_request:

jobs:
  bash-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          find ./bin ./lib ./tests -type f -print0 | xargs -0 -n1 bash -n

      - name: Run integration tests
        run: bash tests/integration.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './bin ./lib ./tests install.sh uninstall.sh'
