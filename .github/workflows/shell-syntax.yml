name: Shell Syntax Check

on:
  push:
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          find ./bin ./lib -type f -print0 | xargs -0 -I{} bash -n {}
