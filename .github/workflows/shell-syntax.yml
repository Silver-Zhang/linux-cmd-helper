name: Shell Checks

on:
  push:
  pull_request:

jobs:
  bash-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          for file in install.sh uninstall.sh bin/* lib/* tests/*; do
            bash -n "$file"
          done

      - name: Run integration tests
        run: bash tests/integration.sh

      - name: ShellCheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck install.sh uninstall.sh bin/* lib/* tests/*
